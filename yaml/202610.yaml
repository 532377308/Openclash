# ========================
# Clash-ALL 优化配置
# ========================

# 机场节点订阅




proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}


# 以下为 链式代理 socks5 节点，如果要启用，请将前面的 # 去掉

#  - name: 链式落地节点名称
#    type: socks5
#    server: 
#    port: 
#    username: 
#    password: 
#    udp: true
#    dialer-proxy: 香港-自动

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 国内
    - 所有-自动
    - 所有-手动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 韩国-故转
    - 新加坡-故转
    - 美国-故转

proxy-groups:

# 业务分流组
  - {name: 国外, <<: *default,
      icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png"}

  - {name: Stream Media, <<: *default,
      icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/YouTube.png"}

  - {name: TikTok, <<: *default,
      icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_1.png"}  

  - {name: AI, <<: *default,
      icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png"}

  - {name: 游戏, <<: *default,
      icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/GAME.png"}

  - {name: 国内, type: select, proxies: [直连,所有-手动],
      icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Map.png"}

  - {name: 漏网之鱼, <<: *default,
      icon: "https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/master/Universal/Final.png"}  


#手动组
  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"
    
  - name: 香港-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png"

  - name: 台湾-手动
    type: select
    include-all: true
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png"

  - name: 日本-手动
    type: select
    include-all: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png"

  - name: 韩国-手动
    type: select
    include-all: true
    filter: "(?=.*(韩|KR|Korea|(?i)Seoul)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png"

  - name: 新加坡-手动
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png"

  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(美国|US|States|American|🇺🇸)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png"

#自动组
  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^((?!(直连|拒绝)).)*$"
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"

  - name: 香港-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png"

  - name: 台湾-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png"

  - name: 日本-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png"

  - name: 韩国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(韩|KR|Korea|(?i)Seoul)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png"

  - name: 新加坡-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png"

  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(美国|US|States|American|🇺🇸)).*$"
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png"

#故转组

  - name: 香港-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 香港-手动
      - 香港-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png"

  - name: 台湾-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 台湾-手动
      - 台湾-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png"

  - name: 日本-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 日本-手动
      - 日本-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png"

  - name: 韩国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 韩国-手动
      - 韩国-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png"

  - name: 新加坡-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 新加坡-手动
      - 新加坡-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png"

  - name: 美国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 美国-手动
      - 美国-自动
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png"


